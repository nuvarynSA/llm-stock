services:
  demo:
    build: .
    container_name: llm-stock-demo
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your .env file (see .env.example)}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PORT: '3000'
